<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Шаблон креативу Meta. {{…}} підставляє tools/creatives/build.js; тексти вже екрановані там.
     Палітра й шрифти — як на вітрині (site/assets/aluma.css): paper/ink/oak, Frank Ruhl Libre + IBM Plex Sans Hebrew. -->
<style>
{{FONTS}}
:root {
  --paper: #F6F1E9; --ink: #211C17; --muted: #5E554C; --oak-deep: #7A5534; --dark: #1F1A15; --cream: #F6F1E9;
  --serif: {{SERIF}}; --sans: "IBM Plex Sans Hebrew", Arial, sans-serif;
  --w: {{W}}px; --h: {{H}}px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); background: var(--paper); overflow: hidden; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.canvas { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); }

.media { position: absolute; inset: 0 0 auto 0; height: var(--media-h); display: grid; gap: 6px; background: var(--paper);
  grid-template-columns: repeat(var(--cols, 1), 1fr); grid-auto-rows: 1fr; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media.n5 { --cols: 2; grid-template-rows: 1.4fr 1fr 1fr; }
.media.n5 img:first-child { grid-column: 1 / -1; }
.media.n4, .media.n2 { --cols: 2; }
.media.n3 { --cols: 2; grid-template-rows: 1.4fr 1fr; }
.media.n3 img:first-child { grid-column: 1 / -1; }

/* Позначка «הדמיה»: непрозора, щоб контраст не залежав від кадру. */
.mark { position: absolute; top: var(--safe-top); left: 32px; padding: 8px 18px; border-radius: 4px;
  background: var(--dark); color: var(--cream); font: 600 26px/1.2 var(--sans); letter-spacing: .02em; }

.panel { position: absolute; inset: auto 0 0 0; height: calc(var(--h) - var(--media-h)); background: var(--paper);
  padding: var(--pad-y) 64px; display: flex; flex-direction: column; justify-content: center; gap: var(--gap); }
.brand { font: 600 24px/1 var(--sans); letter-spacing: .32em; color: var(--oak-deep); }
.headline { font: 500 var(--h1)/1.12 var(--serif); color: var(--ink); text-wrap: balance; }
.sub { font: 400 var(--fs-sub)/1.3 var(--sans); color: var(--muted); }
.foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 6px; }
.price { display: flex; flex-direction: column; gap: 4px; }
.price b { font: 700 var(--fs-price)/1.1 var(--sans); color: var(--ink); }
.price small { font: 400 22px/1.25 var(--sans); color: var(--muted); }
.cta { flex: none; background: var(--dark); color: var(--cream); font: 600 var(--fs-cta)/1 var(--sans);
  padding: 22px 34px; border-radius: 4px; }

/* 1:1 і 4:5 — кадр зверху, текст на панелі знизу. */
.f-1x1 { --media-h: 688px; --safe-top: 28px; --pad-y: 34px; --gap: 12px; --h1: 52px; --fs-sub: 27px; --fs-price: 36px; --fs-cta: 28px; }
.f-4x5 { --media-h: 900px; --safe-top: 28px; --pad-y: 40px; --gap: 14px; --h1: 58px; --fs-sub: 29px; --fs-price: 38px; --fs-cta: 30px; }
/* 9:16 — кадр на весь екран, картка над нижньою зоною інтерфейсу Stories/Reels (~340 px), позначка нижче верхньої (~250 px). */
.f-9x16 { --media-h: var(--h); --safe-top: 270px; --pad-y: 44px; --gap: 16px; --h1: 64px; --fs-sub: 30px; --fs-price: 40px; --fs-cta: 30px; }
.f-9x16 .panel { inset: auto 48px 360px 48px; height: auto; border-radius: 10px; padding: 44px 52px; }
</style>
</head>
<body>
<div class="canvas f-{{FORMAT}}">
  <div class="media n{{COUNT}}">{{TILES}}</div>
  <div class="mark" data-text>{{MARK}}</div>
  <div class="panel">
    <div class="brand" data-text>{{BRAND}}</div>
    <h1 class="headline" data-text>{{HEADLINE}}</h1>
    <p class="sub" data-text>{{SUB}}</p>
    <div class="foot">
      <div class="price"><b data-text>{{PRICE}}</b><small data-text>{{PRICE_NOTE}} · {{INCLUDES}}</small></div>
      <div class="cta" data-text>{{CTA}}</div>
    </div>
  </div>
</div>
</body>
</html>
