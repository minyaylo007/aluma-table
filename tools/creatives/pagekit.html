<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Шаблон стартового набору сторінки (аватар, обкладинка, пости, Highlights). {{…}} підставляє tools/creatives/pagekit.js;
     тексти вже екрановані там. Палітра й шрифти — вітрини (site/assets/aluma.css), лого — як у шапці сайту
     (ALUMA Frank Ruhl Libre з розрядкою .32em + «אלומה»), знак — site/assets/favicon.svg. -->
<style>
{{FONTS}}
:root {
  --paper: #F6F1E9; --ink: #211C17; --muted: #5E554C; --oak-deep: #7A5534; --dark: #1F1A15; --cream: #F6F1E9;
  --serif: {{SERIF}}; --sans: "IBM Plex Sans Hebrew", Arial, sans-serif;
  --w: {{W}}px; --h: {{H}}px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); background: var(--paper); overflow: hidden; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.canvas { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); }

/* Лого шапки сайту: латиниця з розрядкою + івритом поруч; знак-паралелограм (favicon.svg). */
.logo { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.logo-lat { font: 400 var(--fs-lat)/1 var(--serif); letter-spacing: .32em; margin-inline-start: .32em; color: var(--ink); direction: ltr; }
.logo-he { font: 400 var(--fs-he)/1 var(--sans); color: var(--muted); }
.sign { width: var(--sign); height: calc(var(--sign) * 4 / 3); color: var(--oak-deep); display: block; }

/* Аватар: коло Meta вписане в квадрат — усе в центральному колі (pagekit.js перевіряє кути .keep). */
.k-avatar .canvas { display: grid; place-items: center; }
.k-avatar { --fs-lat: 140px; --fs-he: 78px; --sign: 250px; }
.k-avatar .logo { gap: 34px; }

/* Кадр і позначка «הדמיה» — як у build.js. */
.media { position: absolute; inset: 0 0 auto 0; height: var(--media-h); display: grid; gap: 6px; background: var(--paper);
  overflow: hidden; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.media img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
.media.n5 { --cols: 2; grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); }
.media.n5 img:first-child { grid-column: 1 / -1; }
.media.n3 { --cols: 2; grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); }
.media.n3 img:first-child { grid-column: 1 / -1; }
.mark { position: absolute; top: var(--safe-top, 28px); left: var(--safe-left, 32px); padding: 8px 18px; border-radius: 4px;
  background: var(--dark); color: var(--cream); font: 600 26px/1.2 var(--sans); letter-spacing: .02em; }

/* Обкладинка 1640×624: на телефоні видно центр 1080×624 — текст і позначка лише там (x 280–1360). */
.k-cover .media { height: 100%; }
.k-cover .media img { object-position: 50% 34%; }
.k-cover { --safe-left: 300px; --safe-top: 32px; --fs-lat: 52px; --fs-he: 30px; }
.k-cover .card { position: absolute; top: 32px; right: 300px; width: 470px; padding: 34px 40px; border-radius: 6px;
  background: var(--paper); display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.k-cover .card .logo { flex-direction: row; align-items: baseline; gap: 18px; }
.k-cover .card h1 { font: 500 40px/1.15 var(--serif); color: var(--ink); }
.k-cover .card p { font: 400 25px/1.3 var(--sans); color: var(--muted); }

/* Пости 1:1 і 4:5 — кадр зверху, панель знизу, як у креативах. */
.panel { position: absolute; inset: auto 0 0 0; height: calc(var(--h) - var(--media-h)); background: var(--paper);
  padding: var(--pad-y) 64px; display: flex; flex-direction: column; justify-content: center; gap: var(--gap); }
.brand { font: 400 26px/1 var(--serif); letter-spacing: .32em; color: var(--oak-deep); direction: ltr; text-align: right; }
.headline { font: 500 var(--h1)/1.12 var(--serif); color: var(--ink); text-wrap: balance; }
.sub { font: 400 var(--fs-sub)/1.3 var(--sans); color: var(--muted); }
.foot { display: flex; align-items: baseline; gap: 18px; margin-top: 4px; flex-wrap: wrap; }
.foot b { font: 700 var(--fs-price)/1.1 var(--sans); color: var(--ink); }
.foot small { font: 400 22px/1.25 var(--sans); color: var(--muted); }
.k-post.f-1x1 { --media-h: 700px; --pad-y: 30px; --gap: 12px; --h1: 50px; --fs-sub: 27px; --fs-price: 34px; }
.k-post.f-4x5 { --media-h: 900px; --pad-y: 40px; --gap: 14px; --h1: 56px; --fs-sub: 29px; --fs-price: 38px; }

/* Highlights 1080×1920: Instagram показує коло в центрі — значок у колі Ø 600, тло тону «אלון טבעי» каталогу. */
.k-hl .canvas { display: grid; place-items: center; background: var(--hl-bg); }
.k-hl .disc { width: 600px; height: 600px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; }
.k-hl { --sign: 200px; }
.dots { width: 400px; display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; }
.dots i { width: 110px; height: 110px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 2px rgba(33,28,23,.14); }
.extend { width: 400px; height: auto; color: var(--ink); display: block; }
</style>
</head>
<body class="k-{{KIND}} f-{{FORMAT}}">
<div class="canvas">
{{BODY}}
</div>
</body>
</html>
