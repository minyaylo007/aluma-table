<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Картка каруселі «один стіл у п'яти тонах». {{…}} підставляє tools/creatives/tones.js; тексти вже екрановані там.
     Палітра й шрифти — як у template.html. Класи .media/.mark/.panel — ті, що міряє measure() з build.js. -->
<style>
{{FONTS}}
:root {
  --paper: #F6F1E9; --ink: #211C17; --muted: #5E554C; --oak-deep: #7A5534; --dark: #1F1A15; --cream: #F6F1E9;
  --serif: {{SERIF}}; --sans: "IBM Plex Sans Hebrew", Arial, sans-serif;
  --w: {{W}}px; --h: {{H}}px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); background: var(--paper); overflow: hidden; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.canvas { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); }
.media { position: absolute; inset: 0 0 auto 0; height: var(--media-h); overflow: hidden; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mark { position: absolute; top: 28px; left: 32px; padding: 8px 18px; border-radius: 4px;
  background: var(--dark); color: var(--cream); font: 600 26px/1.2 var(--sans); letter-spacing: .02em; }
.panel { position: absolute; inset: auto 0 0 0; height: calc(var(--h) - var(--media-h)); background: var(--paper);
  padding: 0 64px; display: flex; align-items: center; gap: 36px; }
/* Зразок шпону з каталогу (site/assets/products/finishes/) — та сама текстура, що в моделі. */
.swatch { flex: none; width: var(--sw); height: var(--sw); border-radius: 50%; object-fit: cover;
  box-shadow: 0 0 0 1px rgba(33, 28, 23, .18); }
.text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.brand { font: 600 22px/1 var(--sans); letter-spacing: .32em; color: var(--oak-deep); }
.tone { font: 500 var(--h1)/1.1 var(--serif); color: var(--ink); }
.sub { font: 400 var(--fs-sub)/1.3 var(--sans); color: var(--muted); }
.note { font: 400 22px/1.25 var(--sans); color: var(--muted); }
.f-1x1 { --media-h: 780px; --sw: 150px; --h1: 52px; --fs-sub: 26px; }
.f-4x5 { --media-h: 1010px; --sw: 170px; --h1: 58px; --fs-sub: 28px; }
</style>
</head>
<body>
<div class="canvas f-{{FORMAT}}">
  <div class="media"><img src="{{IMAGE}}" alt=""></div>
  <div class="mark" data-text>{{MARK}}</div>
  <div class="panel">
    <img class="swatch" src="{{SWATCH}}" alt="">
    <div class="text">
      <div class="brand" data-text>{{BRAND}}</div>
      <h1 class="tone" data-text>{{TONE}}</h1>
      <p class="sub" data-text>{{SUB}}</p>
      <p class="note" data-text>{{NOTE}}</p>
    </div>
  </div>
</div>
</body>
</html>
