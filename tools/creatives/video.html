<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Шаблон відео-креативу. {{…}} підставляє tools/creatives/video.js; кадр часу t малює window.render(t) —
     жодних CSS-таймерів, тож запис детермінований: той самий t → той самий кадр на будь-якій машині. -->
<style>
{{FONTS}}
:root {
  --paper: #F6F1E9; --ink: #211C17; --muted: #5E554C; --oak-deep: #7A5534; --dark: #1F1A15; --cream: #F6F1E9;
  --serif: {{SERIF}}; --sans: "IBM Plex Sans Hebrew", Arial, sans-serif;
  --w: {{W}}px; --h: {{H}}px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); background: var(--paper); overflow: hidden; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.canvas { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); }
.shot { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 50%; will-change: transform; }

/* «הדמיה» — на кожному кадрі, непрозора. */
.mark { position: absolute; top: var(--safe-top); left: 40px; padding: 10px 20px; border-radius: 4px;
  background: var(--dark); color: var(--cream); font: 600 30px/1.2 var(--sans); letter-spacing: .02em; }

/* Картка тексту: суцільне тло — контраст не залежить від кадру. */
.card { position: absolute; left: 48px; right: 48px; bottom: var(--safe-bottom); background: var(--paper);
  border-radius: 10px; padding: 40px 52px; display: flex; flex-direction: column; gap: 14px; }
.brand { font: 600 26px/1 var(--sans); letter-spacing: .32em; color: var(--oak-deep); }
.headline { font: 500 var(--h1)/1.12 var(--serif); color: var(--ink); text-wrap: balance; }
.sub { font: 400 var(--fs-sub)/1.3 var(--sans); color: var(--muted); }
.foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.price { display: flex; flex-direction: column; gap: 4px; }
.price b { font: 700 var(--fs-price)/1.1 var(--sans); color: var(--ink); }
.price small { font: 400 24px/1.25 var(--sans); color: var(--muted); }
.cta { flex: none; background: var(--dark); color: var(--cream); font: 600 var(--fs-cta)/1 var(--sans);
  padding: 22px 34px; border-radius: 4px; }

/* Шкала розміру «складено → розкладено»: числа з каталогу, смуга росте від length/extended до 1. */
.size { display: flex; flex-direction: column; gap: 10px; }
.size .nums { display: flex; justify-content: space-between; font: 600 var(--fs-size)/1 var(--sans); color: var(--ink); direction: ltr; }
.size .track { height: 12px; border-radius: 6px; background: #E4DACB; direction: ltr; }
.size .bar { height: 100%; border-radius: 6px; background: var(--oak-deep); }

/* Колекція: підпис товару міняється разом із кадром. */
.item { position: absolute; inset: 0; padding: inherit; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.item .name { font: 500 var(--h1)/1.1 var(--serif); color: var(--ink); }
.item .line { font: 400 var(--fs-sub)/1.3 var(--sans); color: var(--muted); }
.item .from { font: 700 var(--fs-price)/1.1 var(--sans); color: var(--ink); }
.card.collection { height: var(--card-h); }

/* 9:16 — Reels/Stories: верхні й нижні 14 % (269 px) без тексту. 4:5 і 1:1 — стрічка (4:5 займає більше екрана). */
.f-9x16 { --safe-top: 300px; --safe-bottom: 300px; --h1: 66px; --fs-sub: 32px; --fs-price: 44px; --fs-cta: 32px; --fs-size: 40px; --card-h: 420px; }
.f-4x5 { --safe-top: 36px; --safe-bottom: 36px; --h1: 56px; --fs-sub: 29px; --fs-price: 40px; --fs-cta: 30px; --fs-size: 36px; --card-h: 340px; }
.f-1x1 { --safe-top: 32px; --safe-bottom: 32px; --h1: 50px; --fs-sub: 27px; --fs-price: 36px; --fs-cta: 28px; --fs-size: 32px; --card-h: 300px; }
.f-4x5 .card { padding: 34px 46px; gap: 12px; }
.f-1x1 .card { padding: 28px 40px; gap: 10px; }
</style>
</head>
<body>
<div class="canvas f-{{FORMAT}}">
  {{SHOTS}}
  {{CARD}}
  <div class="mark" data-text>{{MARK}}</div>
</div>
<script>
// Таймлайн (секунди) приходить з video.js. Кадри: [від, до] + Ken Burns; текст: [поява] з fade 0.4 с.
const TL = {{TIMELINE}};
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const shots = [...document.querySelectorAll('.shot')];
const texts = [...document.querySelectorAll('[data-at]')];
const items = [...document.querySelectorAll('.item')];
const bar = document.querySelector('.size .bar');
window.render = (t) => {
  TL.shots.forEach((s, i) => {
    const fadeIn = s.from === 0 ? 1 : ease((t - s.from) / TL.fade);
    const fadeOut = s.to >= TL.duration ? 1 : 1 - ease((t - s.to) / TL.fade);
    shots[i].style.opacity = Math.min(fadeIn, fadeOut);
    const k = Math.min(1, Math.max(0, (t - s.from) / (s.to + TL.fade - s.from)));
    const z = s.z[0] + (s.z[1] - s.z[0]) * k, x = s.x[0] + (s.x[1] - s.x[0]) * k;
    shots[i].firstElementChild.style.transform = `scale(${z}) translateX(${x}%)`;
  });
  for (const el of texts) {
    const a = ease((t - Number(el.dataset.at)) / 0.4);
    el.style.opacity = a; el.style.transform = `translateY(${(1 - a) * 14}px)`;
  }
  items.forEach((el, i) => {
    const s = TL.items[i];
    const a = Math.min(s.from === 0 ? 1 : ease((t - s.from) / TL.fade), s.to >= TL.duration ? 1 : 1 - ease((t - s.to) / TL.fade));
    el.style.opacity = a;
  });
  if (bar) bar.style.width = (100 * (TL.size.ratio + (1 - TL.size.ratio) * ease((t - TL.size.from) / (TL.size.to - TL.size.from)))) + '%';
};
window.render(0);
</script>
</body>
</html>
