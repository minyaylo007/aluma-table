<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
  /* self-contained (no dist/ sheet): the page's ground / ink / secondary tokens as of 2026-09-09 */
  @font-face{font-family:"IBM Plex Sans Hebrew";font-weight:400;src:url(../site/assets/fonts/PlexSansHebrew-400-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+20AA}
  @font-face{font-family:"IBM Plex Sans Hebrew";font-weight:400;src:url(../site/assets/fonts/PlexSansHebrew-400-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:"IBM Plex Sans Hebrew";font-weight:600;src:url(../site/assets/fonts/PlexSansHebrew-600-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+20AA}
  @font-face{font-family:"IBM Plex Sans Hebrew";font-weight:600;src:url(../site/assets/fonts/PlexSansHebrew-600-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:"IBM Plex Sans Hebrew";font-weight:700;src:url(../site/assets/fonts/PlexSansHebrew-700-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+20AA}
  @font-face{font-family:"IBM Plex Sans Hebrew";font-weight:700;src:url(../site/assets/fonts/PlexSansHebrew-700-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  :root{--ground:#F4F1EA;--ink:#252720;--soft:#62645C}
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans Hebrew",system-ui,sans-serif}
  .copy{position:absolute;top:54px;right:72px;left:72px;text-align:right}
  .logo{height:28px;width:auto;display:block;margin:0 0 28px auto;color:var(--ink)}
  h1{font-size:44px;line-height:1.15;font-weight:600;margin:0;letter-spacing:-0.01em}
  p{font-size:24px;line-height:1.3;color:var(--soft);margin:8px 0 0}
  /* the desktop hero master (2.2:1, rendered on the same ground, so it blends with the card) */
  .table{position:absolute;left:150px;top:200px;width:900px;height:auto;display:block}
</style></head>
<body>
  <div class="copy">
    <!--LOGO-->
    <h1>גורן — שולחן אוכל נפתח</h1>
    <p>מ־160 ל־220 ס״מ</p>
  </div>
  <img class="table" src="../renders-master/product/goren-studio-hero-natural-closed.png" alt="">
</body></html>
