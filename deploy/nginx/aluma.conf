# ALUMA — nginx перед gunicorn (127.0.0.1:8005).
#
# ЩЕ НЕ ВСТАНОВЛЕНО. Файл лежить «у стіл»: підключення робить власник
# (у нас нема root). Установка:
#   sudo cp deploy/nginx/aluma.conf /etc/nginx/sites-available/aluma.conf
#   sudo ln -s /etc/nginx/sites-available/aluma.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (certbot) додає власник — тут лише HTTP-частина.
#
# ⚠️ НА ace-main NGINX НЕ ВСТАНОВЛЕНИЙ: 80/443 тримає Caddy
# (/etc/caddy/Caddyfile). Тобто цей файл — заявка «як має бути», а не
# готовий до підключення конфіг. `nginx -t` на цьому файлі НЕ ЗАПУСКАВСЯ
# і запустити його тут нема чим: /etc/nginx не існує. Перевірено розбором
# crossplane (синтаксис, число аргументів, дозволені контексти директив) і
# звіркою кожного location з deploy/caddy/aluma.Caddyfile. Живими запитами
# НЕ заміряно. Розбір топологій і еквівалент для Caddyfile — у
# deploy/README.md, розділи «Три топології», «На ace-main фронтом стоїть
# Caddy» і «nginx/aluma.conf: сторінки, 404, кеш — як у Caddy».
#
# ЗРАЗОК ПОВЕДІНКИ — deploy/caddy/aluma.Caddyfile, варіант (в): nginx мусить
# віддавати сайт так само, як Caddy, і так само, як сьогодні CloudFront + S3.
# Відмінності від Caddy, що лишилися, підписані на місці словами
# «ВІДМІННІСТЬ ВІД CADDY».
#
# ПОРТ 8005 — той самий, що в deploy/systemd/aluma-api.service. Міняти разом.

# ═════════════════════════════════════════════════════════════════════════════
# ⚠️  X-Forwarded-For: realip НА ВХОДІ + ПЕРЕЗАПИС НА ВИХОДІ. НЕ «СПРОЩУВАТИ».
#
# Конфіг має працювати в ДВОХ топологіях, і саме тому тут дві частини, а не
# одна:
#
#   (а) nginx першим:            гість → nginx → gunicorn
#   (б) nginx усередині:  гість → Caddy → nginx → gunicorn      ← реальний
#                                                                 варіант на
#                                                                 ace-main
#
# ── ЧАСТИНА 1: real_ip на вході ──────────────────────────────────────────────
#
#     set_real_ip_from 127.0.0.1;
#     real_ip_header   X-Forwarded-For;
#     real_ip_recursive on;
#
# У топології (б) $remote_addr для nginx — це адреса Caddy, тобто 127.0.0.1,
# ОДНА НА ВСІХ ГОСТЕЙ. Без цих трьох рядків рядок `proxy_set_header
# X-Forwarded-For $remote_addr` проштампував би КОЖНОГО гостя як 127.0.0.1:
# усі впали б в одне ведро обмежувача, і після пʼятої заявки за годину 429
# отримали б УСІ. Це не теорія, це виміряно (арм B нижче): за проксі всі
# запити лягли в одне ведро й з шостого пішов 429 — самоблокування.
#
# З real_ip nginx бере адресу з X-Forwarded-For (але ЛИШЕ якщо запит прийшов
# з 127.0.0.1 — set_real_ip_from), і $remote_addr всередині nginx стає
# справжньою адресою гостя. У топології (а) запит приходить не з 127.0.0.1,
# X-Forwarded-For ігнорується, $remote_addr лишається адресою гостя — той
# самий результат. ОДИН КОНФІГ, ДВІ ТОПОЛОГІЇ.
#
# Підробці взятися нема звідки: Caddy кладе в X-Forwarded-For РІВНО ОДНЕ
# значення й клієнтського префікса не зберігає (див. заміри нижче), тож
# real_ip_recursive нема куди відходити назад по ланцюжку.
#
# ── ЧАСТИНА 2: перезапис на виході ───────────────────────────────────────────
#
# Нижче в кожному proxy-блоці стоїть
#
#     proxy_set_header X-Forwarded-For $remote_addr;
#
# а НЕ канонічний $proxy_add_x_forwarded_for. Це зроблено НАВМИСНО, і це
# головна причина, чому цей файл узагалі зʼявився.
#
# ЧОМУ. api/handler.py:147-151 client_ip() бере ПЕРШИЙ елемент X-Forwarded-For:
#
#     xff = h.get("x-forwarded-for") or ""
#     if xff:
#         return xff.split(",")[0].strip()
#
# Далі цей IP солиться (hash_ip) і стає ключем ведра обмежувача:
#   RLE#<ip_hash>#<хвилина>  — події,     handler.py:318-321
#   RLL#R|T#<ip_hash>#<година> — заявки,  handler.py:423-429 (LEADS_PER_IP_PER_HOUR=5)
#
# $proxy_add_x_forwarded_for ДОПИСУЄ IP зʼєднання В КІНЕЦЬ того, що надіслав
# клієнт. Тобто гість, який сам поставить «X-Forwarded-For: 1.2.3.4», отримає
# в застосунку «1.2.3.4, <його справжній IP>», а client_ip() візьме ПЕРШИЙ —
# підроблений. Ліміт «5 заявок з IP на годину» обходиться одним заголовком
# у curl: щоразу нове значення — щоразу нове ведро.
#
# ⚠️ НЕ МІНЯТИ НА $proxy_add_x_forwarded_for. Це не стильова причіпка:
# handler.py читає ПЕРШИЙ елемент ланцюжка — найлегше підроблюваний кінець.
# Поки код такий, фронт зобовʼязаний віддавати рівно одне значення.
#
# Сьогодні це прикрито тим, що перед лямбдою стоїть CloudFront: він сам
# нормалізує X-Forwarded-For. ПІСЛЯ ПЕРЕЇЗДУ на цей сервер CloudFront зникає,
# і прикриття зникає разом із ним. Перезапис нижче — його заміна.
#
# ТА САМА ПАСТКА знайдена в сусідньому проєкті (central-aparts-site, обмежувач
# перебору купонів у бек-офісі). Вона одна на два проєкти — тому й тут, і там
# у конфігах стоїть однаковий перезапис.
#
# ── ЩО ВИМІРЯНО ──────────────────────────────────────────────────────────────
#
# Сім POST /api/fx/lead підряд з ОДНАКОВИМ підробленим X-Forwarded-For при
# ліміті 5/год, потім восьмий — з ІНШИМ підробленим значенням:
#
#   A. напряму в gunicorn:        422 422 422 422 422 429 429 → зміна → 422  ДІРА
#   B. через Caddy без header_up: 422 422 422 422 422 429 429 → зміна → 429  закрито
#   C. через Caddy з header_up:   422 422 422 422 422 429 429 → зміна → 429  закрито
#
# Пряме спостереження (замість gunicorn — ехо-сервер, що друкує заголовок):
# клієнт шле «X-Forwarded-For: 9.9.9.9» — застосунок бачить '127.0.0.1';
# клієнт шле «9.9.9.9, 5.5.5.5» — застосунок бачить '127.0.0.1'.
# Тобто Caddy 2.11.4 клієнтське значення ВІДКИДАЄ ЦІЛКОМ і ставить заголовок
# заново за адресою зʼєднання (з версії 2.7 trusted_proxies за замовчуванням
# порожній). У топології Caddy → gunicorn діра закрита з коробки, а
# `header_up X-Forwarded-For {remote_host}` дає ІДЕНТИЧНИЙ результат і
# потрібен лише як явна страховка на випадок, якщо колись пропишуть
# trusted_proxies.
#
# ── КОЛИ ЦЕ ТРЕБА БУДЕ ЗМІНИТИ ───────────────────────────────────────────────
#
# Якщо перед фронтом стане ЩЕ ОДИН проксі з чужою адресою — Cloudflare, CDN,
# балансувальник, — до `set_real_ip_from 127.0.0.1` треба дописати його
# діапазони (а для Cloudflare правильніше `real_ip_header CF-Connecting-IP`).
# Без цього $remote_addr знову стане адресою проксі, однією на всіх.
# Рядок `proxy_set_header X-Forwarded-For $remote_addr` при цьому лишається
# правильним без жодної правки — міняється тільки вхідна частина.
# ═════════════════════════════════════════════════════════════════════════════

# ── Cache-Control по шляху — як scripts/deploy.sh ставив у S3 ────────────────
#
#   /assets/*                 рік, immutable — імена з хешем (build.py)
#   /robots.txt, /sitemap.xml година
#   решта (сторінки)          max-age=0, must-revalidate — викат видно одразу
#
# Ті самі значення, що @assets / @meta / @pages у Caddy-файлі.
#
# map живе в контексті http (цей файл include-иться з sites-enabled), тобто
# імена змінних СПІЛЬНІ на весь nginx — разом із сайтом central-aparts-site,
# якщо обидва стануть в один nginx. Звідси префікс aluma_: не перейменовувати
# на щось загальне на кшталт $cache_control.
map $uri $aluma_cache_by_path {
    default         "public, max-age=0, must-revalidate";
    ~^/assets/      "public, max-age=31536000, immutable";
    /robots.txt     "public, max-age=3600";
    /sitemap.xml    "public, max-age=3600";
}

# Сторінка помилки — no-store ПОВЕРХ шляху, як `header Cache-Control
# "no-store"` у handle_errors Caddy. Без цього 404 на /assets/<старий хеш>
# узяв би з мапи вище «рік, immutable», і браузер тримав би цю 404 рік.
#
# Вирішується за $status, а не за $uri: при error_page запит уже внутрішньо
# переведений на /404.html, і сам шлях не каже, помилка це чи ні. /404.html
# і /404, запитані напряму, — звичайні сторінки: 200 і кеш сторінки, як у Caddy.
map $status $aluma_cache_control {
    404         "no-store";
    default     $aluma_cache_by_path;
}

server {
    # ⚠️ ТІЛЬКИ 127.0.0.1. У топології (б) фронтом лишається Caddy, і nginx
    # мусить бути недосяжним ззовні: інакше до нього можна постукатися повз
    # Caddy. Підробити адресу це не дасть (set_real_ip_from не довіряє чужій
    # адресі — X-Forwarded-For від такого гостя буде проігноровано), а от
    # обійти кеш і ліміти фронту — дасть.
    #
    # 8007: 8000-8003 — чужі бойові, 8004 — central-aparts-site (gunicorn),
    # 8005 — наш gunicorn, 8006 — nginx проєкту central-aparts-site (у них
    # така сама топологія Caddy → nginx → gunicorn; порт закріплено в
    # ~/maestro/PORTS.md). Нам виділено 8007.
    #
    # ⚠️ ПЕРЕД ТИМ ЯК УЗЯТИ ВІЛЬНИЙ ПОРТ — дивитися в ~/maestro/PORTS.md, а не
    # в `ss -ltn`. Ми з сусіднім проєктом обидва вибрали «перший вільний» і
    # обидва взяли 8006, з різницею у двадцять хвилин: `ss` показує лише те,
    # що слухає ЗАРАЗ, а обидва конфіги лежали «у стіл» і не слухали нічого.
    #
    # Порт названий іще й у Caddyfile (reverse_proxy) — міняти разом. Заявка
    # для Caddy — deploy/caddy/aluma.Caddyfile, варіант (б); у /etc/caddy її
    # кладе власник.
    listen      127.0.0.1:8007;

    # У топології (а) — nginx першим, він же тримає 80/443 — цей рядок треба
    # замінити на публічний listen:
    #     listen      80;
    #     listen      [::]:80;
    # Блок real_ip нижче при цьому лишається на місці й нічого не ламає:
    # запити приходять не з 127.0.0.1, тож X-Forwarded-For ігнорується.

    server_name table.central-aparts.store;

    # ── real_ip: $remote_addr = справжня адреса гостя в ОБОХ топологіях ──────
    # Пояснення — у блоці вгорі файлу. Довіряємо ЛИШЕ 127.0.0.1 (Caddy на цій
    # же машині); запиту з будь-якої іншої адреси X-Forwarded-For не вірять.
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # charset дописує "; charset=utf-8" до text/html, text/plain, text/xml —
    # звідси "text/html; charset=utf-8" на сторінках, як deploy.sh ставив у S3.
    charset              utf-8;

    # Лімит тіла на API — як `request_body { max_size 1MB }` у Caddy.
    # ВІДМІННІСТЬ ВІД CADDY: там лімит лише на /api/fx/* і /admin*, тут — на
    # весь server. На ділі різниці нема: статика тіла не приймає (nginx
    # відповідає 405 на POST до файлу).
    client_max_body_size 1m;

    # ВІДМІННІСТЬ ВІД CADDY: у блоці сайту Caddy нема `log`, тож доступ він
    # не пише. Тут журнал є — він потрібен, щоб розбирати 404 і 429 після
    # переїзду. Персональних даних у ньому нема: лише адреса, шлях і код.
    access_log /var/log/nginx/aluma.access.log;
    error_log  /var/log/nginx/aluma.error.log;

    root  /opt/ihor/aluma-table/dist;
    index index.html;

    # ── Редиректи — ВІДНОСНІ ─────────────────────────────────────────────────
    # За замовчуванням nginx пише в Location АБСОЛЮТНУ адресу зі своїм портом:
    # у топології (б) гість отримав би `Location: http://<host>:8007/en/` —
    # порт на петлі, ззовні недосяжний, та ще й http замість https. Відносний
    # Location однаковий в обох топологіях. Caddy (`redir /en /en/ 308`) теж
    # пише відносний `/en/`.
    absolute_redirect off;

    # ── Стиск — Compress: true у CloudFront, `encode zstd gzip` у Caddy ──────
    # ВІДМІННІСТЬ ВІД CADDY: лише gzip. zstd і brotli в nginx — сторонні
    # модулі, у стандартному пакеті Ubuntu їх нема. text/html стискається
    # завжди (у gzip_types його не пишуть — nginx попереджає про дубль).
    # Картинки й woff2 уже стиснені. JSON API стискається теж — як у Caddy.
    # У (б) перед nginx стоїть ще й `encode` Caddy: відповідь, що вже має
    # Content-Encoding, він не чіпає, подвійного стиску не буде.
    gzip       on;
    gzip_vary  on;
    gzip_types text/css text/plain text/xml application/xml
               application/javascript text/javascript application/json
               image/svg+xml;

    # ── 404: сторінка сайту зі статусом 404 ─────────────────────────────────
    # Як CustomErrorResponses у CloudFront (infra/template.yaml) і
    # `handle_errors 403 404` у Caddy. 403 теж: так CloudFront перетворював
    # «ключа нема» від S3, і так тут виглядатиме тека без index.html чи файл
    # без права на читання. Cache-Control сторінки помилки — no-store (мапа
    # $aluma_cache_control угорі), заголовки — з `location /` нижче: сам
    # /404.html обслуговується саме там.
    #
    # JSON-відповіді API сюди НЕ потрапляють: для проксійованих відповідей
    # error_page спрацьовує лише з proxy_intercept_errors on, а він вимкнений
    # (за замовчуванням). 404 від застосунку — `{"ok": false, "error": "not
    # found"}` — доїде як є, так само як через reverse_proxy у Caddy.
    # ⚠️ НЕ вмикати proxy_intercept_errors у блоках /api/fx/ і /admin.
    error_page 403 404 =404 /404.html;

    # ── API: заявки, події, health ───────────────────────────────────────────
    # ^~ — щоб жодна регулярка (зокрема «сторінки без розширення» нижче, якщо
    # її колись винесуть із `location /` нагору) не перехопила /api/fx/lead:
    # у цьому шляху теж нема крапки. Своїх add_header тут нема навмисно —
    # заголовки статики сюди не успадковуються (вони в `location /`, а не в
    # server {}), і JSON-відповіді доходять як є, як через reverse_proxy Caddy.
    location ^~ /api/fx/ {
        proxy_pass http://127.0.0.1:8005;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # ПЕРЕЗАПИС, не дописування. Пояснення — у блоці вгорі файлу.
        # НЕ міняти на $proxy_add_x_forwarded_for: handler.py:147-151 бере
        # ПЕРШИЙ елемент, а перший елемент підробляється тривіально.
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_redirect     off;

        # timeout юніта — 60 с, тримаємо той самий порядок
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Адмінка ─────────────────────────────────────────────────────────────
    # handler.py:934-941 віддає /admin, /admin/login, /admin/logout,
    # /admin/status тим самим застосунком. Без цього блоку після переїзду
    # адмінка просто зникне (nginx шукатиме файл /admin у dist/ і дасть 404).
    # ^~ — з тієї самої причини, що в /api/fx/.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8005;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # ПЕРЕЗАПИС, не дописування. Пояснення — у блоці вгорі файлу.
        # НЕ міняти на $proxy_add_x_forwarded_for: handler.py:147-151 бере
        # ПЕРШИЙ елемент, а перший елемент підробляється тривіально.
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_redirect     off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Кука адмінки — короткоживуча підписана, кешувати нічого.
        # ВІДМІННІСТЬ ВІД CADDY: Caddy на /admin* нічого не додає. Тут
        # лишається як страховка; на ділі це дубль — handler.py resp() сам
        # ставить `cache-control: no-store` на КОЖНУ відповідь.
        add_header Cache-Control "no-store" always;
    }

    # ── Статика: те, що сьогодні лежить у S3 за CloudFront ──────────────────
    # dist/ збирається build.py (build.py:31 DIST = ROOT / "dist").
    #
    # try_files нижче ЗАМІНЮЄ CloudFront-функцію fx-table-index-rewrite
    # (infra/template.yaml:196-208), яка дописувала index.html до запитів,
    # що закінчуються слешем. У S3 нема індексу теки, у nginx — є: $uri/
    # разом з `index index.html` і явним $uri/index.html закривають /en/, а
    # все інше чесно падає в 404 замість листингу.
    #
    # Заголовки (безпека + Cache-Control) стоять ТУТ, а не в server {}: інакше
    # їх успадкував би /api/fx/ (своїх add_header у нього нема), і до JSON API
    # доїхав би Cache-Control сторінки. У Caddy заголовки теж лише в `handle`
    # статики. Вкладені location нижче своїх add_header НЕ мають і тому
    # успадковують ці.
    # ⚠️ Додаси add_header у вкладений location — він втратить УСІ заголовки
    # звідси: nginx успадковує add_header лише з рівня, на якому своїх нема.
    location / {
        # Заголовки безпеки — ті, що давала керована політика CloudFront
        # SecurityHeadersPolicy (67f7725c-…) на статиці; значення ті самі, що в
        # Caddy-файлі. `always` — щоб стояли й на сторінці 404: без нього nginx
        # додає заголовок лише до 2xx/3xx.
        add_header Strict-Transport-Security "max-age=31536000"                always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header X-Frame-Options           "SAMEORIGIN"                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "1; mode=block"                   always;
        add_header Cache-Control             $aluma_cache_control              always;

        try_files $uri $uri/ $uri/index.html =404;

        # /en → /en/ (308), як `redir /en /en/ 308` у Caddy. Без редиректу
        # try_files віддав би /en/index.html за адресою /en, і відносні шляхи
        # сторінки рахувалися б від кореня. У CloudFront /en падав у 404.
        location = /en {
            return 308 /en/;
        }

        # Сторінки БЕЗ розширення: /, /en/, /privacy, /terms, /accessibility,
        # /thanks, /404, /next і їхні /en/-версії. build.py (кінець main())
        # кладе поруч із *.html копію без розширення — на них ведуть посилання
        # сайту. nginx визначає тип за розширенням; нема розширення — береться
        # default_type, а він у стандартному nginx.conf application/octet-stream:
        # /privacy СКАЧУВАВСЯ б файлом.
        #
        # Той самий відбір, що `path_regexp ^[^.]*$` у Caddy: шлях без жодної
        # крапки. text/html + `charset utf-8` вище = "text/html; charset=utf-8",
        # як deploy.sh ставив у S3. try_files тут повторено навмисно: у
        # вкладений location він НЕ успадковується.
        location ~ "^[^.]*$" {
            default_type text/html;
            try_files    $uri $uri/ $uri/index.html =404;
        }

        # /assets/* — імена з хешем (build.py), кеш «рік, immutable» з мапи
        # вгорі. Раніше тут стояли `expires 30d` + `Cache-Control: public` —
        # другий заголовок Cache-Control і місяць замість року, не так, як
        # deploy.sh ставив у S3. Прибрано.
        # ^~ — щоб регулярка сторінок вище не перехоплювала /assets/<тека>.
        # ВІДМІННІСТЬ ВІД CADDY: access_log off — хешовані файли не цікаві в
        # журналі (Caddy доступ не пише взагалі, див. access_log угорі).
        location ^~ /assets/ {
            access_log off;
            try_files  $uri =404;
        }
    }
}
