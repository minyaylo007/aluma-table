name: CI

# Перевірки (contracts/workflows.md «ci.yml»): на кожен PR у master, щоночі за розкладом і як частина release.yml
# (workflow_call). Імена завдань — обов'язкові перевірки ruleset master:
# secret-scan, lint, test (3.12), test (3.13), build, browser. tests/smoke.spec.js сюди НЕ входить: він пише в сховище.
#
# Рішення власника 13.10.2026 (P-2026-10-13-03): push у гілку БЕЗ PR перевірок не запускає — раніше кожна правка
# йшла трьома прогонами (push + PR + release на master), а browser (Playwright, ~100 с) — це 98 % часу кожного.
# Нічний прогін ловить дрейф оточення (Chromium, actions) без жодного PR.
#
# secret-scan іде без жодних умов і фільтрів шляхів: правило флоту 13.09 — скан секретів виконується ЗАВЖДИ,
# його не вимикають навіть на коміті в один .md. Саме такий скан знайшов в іншому проєкті коди від дверей
# і пароль WiFi — і знайшов їх у документах, а не в коді.
#
# На master ці перевірки запускає release.yml (завдання checks → workflow_call) — tests/test_pipeline.py.
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 2 * * *'   # щоночі 02:17 UTC (05:17 Київ)
  workflow_call:

permissions:
  contents: read

# Новий прогін тієї ж гілки скасовує старий; на master — ніколи (там за перевірками йде реліз).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Секрети й персональні дані в робочому дереві. Тільки stdlib, ані gitleaks, ані trufflehog:
  # нових двоичних із мережі в конвеєр не ставимо. Секунди роботи, нуль оплачених хвилин
  # (публічний репозиторій). Значення не друкуються ніде — у stdout іде лише підсумок за
  # правилами, а сам звіт лишається в $RUNNER_TEMP і нікуди не публікується: журнал прогону
  # публічного репозиторію читає весь світ (правило власника 10).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Scan the working tree
        # Базова лінія .github/secret-scan-baseline.json — перелік уже переглянутих місць
        # (синтетичні телефони фікстур, зразки в документації, регулярки самого застосунку).
        # Код виходу 1 дають лише НОВІ місця, тож перевірка червоніє на новому, а не завжди.
        run: |
          python scripts/secret_scan.py --repo . --mode tree \
            --baseline .github/secret-scan-baseline.json \
            --report "$RUNNER_TEMP/secret-scan.md"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        run: pip install -r requirements-lint.txt
      - name: ruff
        run: ruff check .
      - name: JS syntax (node --check)
        # site/assets/*.js — шаблони з {{ТОКЕНАМИ}}, які підставляє build.py, тому перевіряється зібраний dist/.
        run: |
          python build.py > /dev/null
          for f in dist/assets/*.js tests/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 — як на машині (ace-main), 3.13 — як у Lambda.
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            tests/requirements.txt
      - name: Install
        run: pip install -r api/requirements.txt -r tests/requirements.txt
      - name: Tests
        # Увесь набір, як локально (CLAUDE.md §8); -v — щоб у журналі було видно пропуски й причини.
        run: python -m unittest discover -s tests -t . -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Без Pillow — як системний python3 машини, яким зібрана статика /srv/aluma (research.md R9).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build (preview) twice — the same bytes
        run: |
          python build.py
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/dist-1.sha256"
          rm -rf dist .build
          python build.py
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/dist-2.sha256"
          diff "$RUNNER_TEMP/dist-1.sha256" "$RUNNER_TEMP/dist-2.sha256"
          wc -l < "$RUNNER_TEMP/dist-1.sha256"

  browser:
    runs-on: ubuntu-latest
    # 30, а не 20: самі spec ідуть ~10 хв, і 23.10 повільне дзеркало apt на промаху кешу додало ще ~10.
    timeout-minutes: 30
    env:
      PREVIEW_PORT: '8007'
      PYTHON: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      # Кеш Chromium (docs/DELIVERY.md §3). 23.10 крок Chromium двічі йшов ~10 хв: сам браузер — 8 с, а системні
      # пакети (--with-deps) apt тягнув із дзеркала Azure на 45 kB/s (25.9 MB за 9 хв 36 с). Тому кешуються обидва:
      # браузери в ~/.cache/ms-playwright і завантажені .deb. Ключ — образ раннера + версія @playwright/test із
      # package-lock.json: нова версія Playwright = новий кеш сам собою. «Зіпсований» кеш — змінити суфікс -v1.
      - name: Playwright version
        id: pw
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-chromium-v1
      - name: Cache apt packages for Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-v1
      - name: Chromium
        # Кеш не зберігає встановлених системних пакетів — install-deps іде завжди, але .deb бере з кешу.
        # Застарілий .deb (оновлення в Ubuntu) apt просто докачає, решту візьме локально.
        env:
          BROWSERS_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          mkdir -p ~/.cache/playwright-apt
          if ls ~/.cache/playwright-apt/*.deb > /dev/null 2>&1; then
            sudo cp ~/.cache/playwright-apt/*.deb /var/cache/apt/archives/
          fi
          if [ "$BROWSERS_HIT" = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
          cp /var/cache/apt/archives/*.deb ~/.cache/playwright-apt/ 2> /dev/null || true
          echo "browsers cache hit: ${BROWSERS_HIT:-false}; .deb in cache: $(ls ~/.cache/playwright-apt | wc -l)"
      - name: Build (preview)
        run: python build.py
      - name: redesign.spec.js (fully mocked)
        run: npx playwright test --config playwright.local.config.js
      - name: a11y.spec.js (axe-core, WCAG 2.1 AA — ת"י 5568)
        # Без порту: dist/ через page.route. Падає на serious/critical на будь-якій сторінці he/en
        # (תקנה 35, docs/COMPLIANCE-IL.md). dist/ уже зібраний кроком вище — npm run test:a11y зібрав би вдруге.
        run: npx playwright test --config playwright.a11y.config.js
      - name: responsive.spec.js (ширини 320–1920, zoom 200 %, фокус, липка кнопка, bdi)
        # Без порту, той самий dist/. Відомі дірки вітрини — у KNOWN самого spec, нове — червоне.
        run: npx playwright test --config playwright.responsive.config.js
      - name: tracking-events.spec.js (згода, PageView/ViewContent/CustomizeProduct/Contact/Lead, event_id для CAPI)
        # На чому тримається тест у Meta. connect.facebook.net — підробка, що записує виклики fbq; мережі назовні немає.
        run: npx playwright test --config playwright.tracking.config.js
